services:
  sulgx:
    build: .
    image: sulgx-panel:1.5.8
    container_name: sulgx-panel

    environment:
      - DB_PATH=/data/panel.db
      - PORT=${PORT:-8000}
      - PANEL_BIND_HOST=0.0.0.0
      - SOCKS_PORT=0
      - TG_PROXY_PORT=0
      - HTTP_PROXY_PORT=0

    ports:
      - "8000:8000"

    volumes:
      - sulgx-data:/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; port=os.environ.get('PORT','8000'); urllib.request.urlopen('http://localhost:'+port+'/health')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  sulgx-data:
