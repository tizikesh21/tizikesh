[project]
name = "tizikesh"
version = "0.1.0"
description = "Tizikesh FastAPI Worker"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "websockets==14.1",
    "httpx==0.27.0",
    "psutil==6.0.0",
    "bcrypt==4.2.0",
    "python-jose[cryptography]==3.3.0",
    "slowapi==0.1.9",
    "python-json-logger==2.0.7",
    "aiosqlite==0.20.0",
    "asyncpg>=0.28.0",
    "pyyaml>=6.0.3",
    "aiofiles>=23.2.1",
    "anyio==4.14.1",
    "python-socks[asyncio]>=2.0.0",
    "cryptography>=42.0.0",
    "starlette>=0.37.2,<0.39.0",
    "blake3>=0.4.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
